services:

  backend1:
    build:
      context: .
      platforms:
        - linux/amd64
    image: manusehgal/awsloadbalancer-backend1:latest
    environment:
      - SERVER_NAME=Backend-1

  backend2:
    build:
      context: .
      platforms:
        - linux/amd64
    image: manusehgal/awsloadbalancer-backend2:latest
    environment:
      - SERVER_NAME=Backend-2

  nginx:
    image: nginx:stable
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
